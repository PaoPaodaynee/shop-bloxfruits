<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Shop Blox Fruits OTOPI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        
        <!-- HEADER SHOP -->
        <header class="flex justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700 mb-8">
            <h1 class="text-2xl font-black text-red-500 tracking-wider">🔥 SHOP BLOX FRUITS OTOPI</h1>
            
            <div id="auth-area" class="flex items-center gap-3">
                <!-- Khu vực nút đăng nhập -->
            </div>
        </header>

        <h2 class="text-xl font-bold mb-6 text-gray-300 border-l-4 border-red-500 pl-3">KHO ACC TỰ ĐỘNG</h2>
        <div id="acc-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </div>

    <!-- MODAL ĐĂNG NHẬP -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 max-w-sm w-full">
            <h2 class="text-xl font-bold mb-2 text-center text-blue-400">ĐĂNG NHẬP</h2>
            <p class="text-xs text-gray-400 text-center mb-4">(Admin đăng nhập nick tại đây sẽ tự chuyển sang trang Đăng Acc)</p>
            <form id="login-form" class="space-y-4">
                <input type="text" id="login-user" required placeholder="Tên tài khoản" class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-sm">
                <input type="password" id="login-pass" required placeholder="Mật khẩu" class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-sm">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-2.5 rounded-lg font-bold">Đăng Nhập</button>
            </form>
            <button onclick="closeModals()" class="mt-3 text-xs text-gray-400 hover:text-white w-full text-center">Đóng lại</button>
        </div>
    </div>

    <!-- MODAL ĐĂNG KÝ -->
    <div id="register-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 max-w-sm w-full">
            <h2 class="text-xl font-bold mb-2 text-center text-green-400">TẠO TÀI KHOẢN MỚI</h2>
            <p class="text-xs text-yellow-400 text-center mb-4">🎁 Tặng ngay 100.000 VNĐ khi đăng ký!</p>
            <form id="register-form" class="space-y-4">
                <input type="text" id="reg-user" required placeholder="Tên tài khoản bạn muốn tạo" class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-sm">
                <input type="password" id="reg-pass" required placeholder="Mật khẩu" class="w-full bg-gray-900 border border-gray-700 rounded p-2.5 text-sm">
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 py-2.5 rounded-lg font-bold">Đăng Ký Ngay</button>
            </form>
            <button onclick="closeModals()" class="mt-3 text-xs text-gray-400 hover:text-white w-full text-center">Đóng lại</button>
        </div>
    </div>

    <!-- MODAL HIỆN ACC SAU KHI MUA -->
    <div id="modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-gray-800 p-6 rounded-xl border border-green-500 text-center max-w-sm w-full">
            <h2 class="text-xl font-bold text-green-400 mb-2">🎉 Mua Thành Công!</h2>
            <p class="text-sm text-gray-300 mb-4">Thông tin tài khoản Roblox của bạn:</p>
            <div class="bg-gray-900 p-3 rounded text-left font-mono text-sm border border-gray-700 mb-4">
                <p>Tài khoản: <span id="user-out" class="text-yellow-400 font-bold"></span></p>
                <p>Mật khẩu: <span id="pass-out" class="text-yellow-400 font-bold"></span></p>
            </div>
            <button onclick="document.getElementById('modal').classList.add('hidden')" class="bg-blue-600 px-4 py-2 rounded font-bold w-full">Xong</button>
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('otopi_user')) || null;

        function updateHeader() {
            const authArea = document.getElementById('auth-area');
            if (currentUser) {
                let adminBtn = '';
                // Nếu là nick admin thì hiện thêm nút Vào trang Đăng Acc
                if (currentUser.role === 'admin') {
                    adminBtn = `<a href="/admin.html" class="bg-yellow-500 hover:bg-yellow-600 text-black px-3 py-1.5 rounded-lg text-sm font-black">⚙️ ĐĂNG ACC</a>`;
                }

                authArea.innerHTML = `
                    ${adminBtn}
                    <div class="bg-gray-700 px-3 py-1.5 rounded-lg border border-yellow-500 text-yellow-400 text-sm font-bold">
                        👤 ${currentUser.username} | ${currentUser.balance.toLocaleString('vi-VN')} đ
                    </div>
                    <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-sm font-bold">
                        Đăng Xuất
                    </button>
                `;
            } else {
                authArea.innerHTML = `
                    <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded-lg text-sm font-bold">
                        Đăng Nhập
                    </button>
                    <button onclick="document.getElementById('register-modal').classList.remove('hidden')" class="bg-green-600 hover:bg-green-700 px-3 py-1.5 rounded-lg text-sm font-bold">
                        Đăng Ký (+100k)
                    </button>
                `;
            }
        }

        async function loadAccounts() {
            const res = await fetch('/api/accounts');
            const accounts = await res.json();
            const list = document.getElementById('acc-list');
            list.innerHTML = '';

            accounts.forEach(acc => {
                list.innerHTML += `
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex flex-col justify-between">
                        <div>
                            <span class="text-xs bg-red-600 px-2 py-1 rounded font-bold">Mã #${acc.id}</span>
                            <h3 class="font-bold text-lg mt-2">${acc.title}</h3>
                            <p class="text-sm text-gray-400 mt-2">⚔️ Level: <span class="text-white">${acc.level}</span></p>
                            <p class="text-sm text-gray-400">🍎 Trái: <span class="text-purple-400 font-semibold">${acc.fruit}</span></p>
                            <p class="text-sm text-gray-400">👊 Melee: <span class="text-orange-400 font-semibold">${acc.melee}</span></p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-gray-700 flex justify-between items-center">
                            <span class="text-yellow-400 font-bold text-lg">${acc.price.toLocaleString('vi-VN')} đ</span>
                            <button onclick="buyAcc(${acc.id})" class="bg-green-600 hover:bg-green-700 px-3 py-1.5 rounded font-bold text-sm">Mua Ngay</button>
                        </div>
                    </div>
                `;
            });
        }

        async function buyAcc(id) {
            if (!currentUser) {
                alert("Bạn phải Đăng Nhập hoặc Đăng Ký trước nhé!");
                document.getElementById('login-modal').classList.remove('hidden');
                return;
            }

            if (!confirm("Xác nhận mua tài khoản này?")) return;

            const res = await fetch('/api/buy', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ accountId: id, username: currentUser.username })
            });
            const data = await res.json();

            if (data.success) {
                currentUser.balance = data.newBalance;
                localStorage.setItem('otopi_user', JSON.stringify(currentUser));
                updateHeader();
                document.getElementById('user-out').innerText = data.accountInfo.username;
                document.getElementById('pass-out').innerText = data.accountInfo.password;
                document.getElementById('modal').classList.remove('hidden');
                loadAccounts();
            } else {
                alert(data.message);
            }
        }

        // XỬ LÝ ĐĂNG NHẬP
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('login-user').value,
                    password: document.getElementById('login-pass').value
                })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                localStorage.setItem('otopi_user', JSON.stringify(currentUser));

                // NẾU LÀ SẾP ADMIN -> LƯU MÃ VÀ TỰ ĐỘNG CHUYỂN SANG TRANG ADMIN LUÔN!
                if (data.isAdmin) {
                    localStorage.setItem('otopi_admin_token', data.adminToken);
                    alert("🚀 Xin chào Sếp OTOPI! Đang bay sang trang Quản trị đăng acc...");
                    window.location.href = '/admin.html';
                    return;
                }

                closeModals();
                updateHeader();
            } else {
                alert(data.message);
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('reg-user').value,
                    password: document.getElementById('reg-pass').value
                })
            });
            const data = await res.json();
            if (data.success) {
                alert(data.message);
                currentUser = data.user;
                localStorage.setItem('otopi_user', JSON.stringify(currentUser));
                closeModals();
                updateHeader();
            } else {
                alert(data.message);
            }
        });

        function logout() {
            localStorage.removeItem('otopi_user');
            localStorage.removeItem('otopi_admin_token');
            currentUser = null;
            updateHeader();
        }

        function closeModals() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('register-modal').classList.add('hidden');
        }

        updateHeader();
        loadAccounts();
    </script>
</body>
</html>
